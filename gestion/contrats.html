<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Contrats — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — contrats passés avec d'autres entreprises du serveur (registre interne, permission « contrats »).
       Cycle : en négociation → actif → terminé (verse une écriture DOT) ou annulé. Serveur :
       entreprise/routes/contrats.ts et entreprise/contrats.ts. -->
  <main class="admin-contenu">
    <section id="panneau-contrats">
      <div class="entete-admin">
        <div>
          <h1 style="margin-bottom:2px;">Contrats</h1>
          <p style="margin:0;font-size:var(--fs-3);">Contrats passés avec d’autres entreprises : réparations, soins, prestations…</p>
        </div>
        <button type="button" class="btn btn-or" id="bouton-nouveau-contrat"><svg class="ico" aria-hidden="true"><use href="#ico-plus"></use></svg> Nouveau contrat</button>
      </div>
      <div id="zone-message-contrats" role="status"></div>

      <div class="comptes-outils">
        <div class="comptes-filtres" role="group" aria-label="Afficher">
          <button type="button" class="comptes-filtre actif" data-statut-contrat="" aria-pressed="true">Tous</button>
          <button type="button" class="comptes-filtre" data-statut-contrat="negociation" aria-pressed="false">En négociation</button>
          <button type="button" class="comptes-filtre" data-statut-contrat="actif" aria-pressed="false">Actifs</button>
          <button type="button" class="comptes-filtre" data-statut-contrat="termine" aria-pressed="false">Terminés</button>
          <button type="button" class="comptes-filtre" data-statut-contrat="annule" aria-pressed="false">Annulés</button>
        </div>
        <div class="comptes-recherche">
          <svg class="ico" aria-hidden="true"><use href="#ico-search"></use></svg>
          <input type="search" id="recherche-contrats" aria-label="Rechercher un contrat par partenaire ou objet" placeholder="Partenaire, objet">
        </div>
      </div>
      <div class="comptes-liste contrats-liste" id="contrats-liste"></div>
    </section>
  </main>

<div class="modale-fond cache" id="modale-contrat">
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-contrat-titre">
    <div class="modale-entete">
      <h2 id="modale-contrat-titre" class="modale-titre">Nouveau contrat</h2>
      <button type="button" id="fermer-modale-contrat" aria-label="Fermer">✕</button>
    </div>
    <div id="zone-message-modale-contrat"></div>
    <form id="formulaire-contrat" autocomplete="off">
      <div class="champ"><label for="contrat-partenaire">Partenaire</label><input type="text" id="contrat-partenaire" maxlength="100" placeholder="Nom de l’autre entreprise" required></div>
      <div class="champ"><label for="contrat-objet">Objet</label><input type="text" id="contrat-objet" maxlength="200" placeholder="Ex. Réparation du véhicule de service" required></div>
      <div class="champ-deux">
        <div class="champ">
          <label for="contrat-sens">Sens</label>
          <select id="contrat-sens">
            <option value="on_paie">On paie (dépense)</option>
            <option value="on_est_paye">On est payé (recette)</option>
          </select>
        </div>
        <div class="champ"><label for="contrat-montant">Montant</label><div class="champ-dollar"><input type="number" id="contrat-montant" min="1" max="2147483647" step="1" required></div></div>
      </div>
      <div class="champ"><label for="contrat-notes">Notes <small>facultatif</small></label><textarea id="contrat-notes" maxlength="500" rows="3"></textarea></div>
      <div class="fiche-rh-pied">
        <button type="submit" class="btn btn-or">Enregistrer</button>
        <button type="button" class="btn btn-fantome" id="contrat-annuler">Annuler</button>
      </div>
    </form>
  </div>
</div>

  <script src="/gestion/contrats.js"></script>
</body>
</html>
