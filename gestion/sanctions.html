<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Sanctions — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — ressources humaines : sanctions, toutes les fiches confondues (permission rh-voir ; ajout et retrait
       réservés à rh-sanctionner). Serveur : /api/rh/sanctions, entreprise/sanctions.ts. -->
  <main class="admin-contenu">
    <section id="panneau-sanctions">
      <div class="entete-admin">
        <div>
          <h1 style="margin-bottom:2px;">Sanctions</h1>
          <p style="margin:0;font-size:var(--fs-3);">Historique disciplinaire de tous les employés.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-or cache" id="bouton-nouvelle-sanction"><svg class="ico" aria-hidden="true"><use href="#ico-plus"></use></svg> Ajouter une sanction</button>
        </div>
      </div>
      <div id="zone-message-sanctions" role="status"></div>
      <div class="agenda-legende cache" id="sanctions-legende"></div>
      <div class="comptes-outils">
        <div class="comptes-recherche">
          <svg class="ico" aria-hidden="true"><use href="#ico-search"></use></svg>
          <input type="search" id="recherche-sanctions" aria-label="Filtrer les sanctions par employé" placeholder="Nom ou prénom">
        </div>
      </div>
      <div class="comptes-liste sanctions-liste" id="rh-sanctions-liste"></div>
    </section>
  </main>

<div class="modale-fond cache modale-pleine" id="modale-sanction">
  <div class="modale modale-pleine" role="dialog" aria-modal="true" aria-labelledby="modale-sanction-titre">
    <div class="modale-entete">
      <h2 id="modale-sanction-titre" class="modale-titre">Ajouter une sanction</h2>
      <button type="button" id="fermer-modale-sanction" aria-label="Fermer">✕</button>
    </div>
    <div id="zone-message-modale-sanction"></div>
    <form id="formulaire-sanction" autocomplete="off" novalidate>
      <div class="champ"><label for="sanction-employe">Employé</label><select id="sanction-employe" required></select></div>
      <div class="champ"><label for="sanction-type">Type</label><select id="sanction-type" required></select></div>
      <div class="champ"><label for="sanction-note">Note <small>facultatif</small></label><textarea id="sanction-note" maxlength="500" rows="3" placeholder="Ce qui s’est passé, en une ou deux phrases"></textarea></div>
      <p class="champ-aide">L’employé verra cette sanction, son type et la note dans Mon compte.</p>
      <div class="modale-boutons">
        <button type="submit" class="btn btn-or">Ajouter la sanction</button>
        <button type="button" class="btn btn-fantome" id="annuler-modale-sanction">Annuler</button>
      </div>
    </form>
  </div>
</div>

<!-- Types de sanction : classement libre (nom, couleur), comme les types d'agenda. -->
<div class="modale-fond cache" id="modale-types-sanction">
  <div class="modale modale-types" role="dialog" aria-modal="true" aria-labelledby="titre-modale-types-sanction">
    <div class="modale-entete">
      <h2 id="titre-modale-types-sanction">Types de sanction</h2>
      <button id="fermer-modale-types-sanction" type="button" aria-label="Fermer">✕</button>
    </div>
    <div class="types-corps">
      <p class="champ-aide types-intro">Les types servent à classer les sanctions par gravité et à les repérer par couleur.</p>
      <div class="types-section-entete">
        <h3 class="types-sous-titre">Types existants</h3>
        <span class="types-compte" id="types-sanction-compte"></span>
      </div>
      <ul class="types-liste" id="types-sanction-liste"></ul>
    </div>
    <div class="types-pied">
      <form class="types-ajout" id="form-type-sanction" novalidate>
        <h3 class="types-sous-titre">Créer un type</h3>
        <div class="types-ajout-champs">
          <div class="champ">
            <label for="type-sanction-nom">Nom</label>
            <input type="text" id="type-sanction-nom" maxlength="40" placeholder="Ex. Avertissement oral">
          </div>
          <div class="champ types-couleur">
            <label for="type-sanction-couleur">Couleur</label>
            <input type="color" id="type-sanction-couleur" aria-label="Couleur du nouveau type">
          </div>
        </div>
        <button type="submit" class="btn btn-or">Ajouter le type</button>
      </form>
      <div id="zone-message-types-sanction" role="status"></div>
    </div>
  </div>
</div>

  <script src="/gestion/sanctions.js"></script>
</body>
</html>
