<body class="page-agents">

       Serveur : entreprise/routes/avis.ts, entreprise/avis.ts. -->
  <main class="admin-contenu">

          <p style="margin:0;font-size:var(--fs-3);">Avis déposés depuis le site, à valider avant publication.</p>
        </div>
      </div>
      <div id="zone-message-avis" role="status"></div>
      <div class="colonnes-statut" id="avis-colonnes"></div>
    </section>

  <script src="/gestion/avis.js"></script>
