<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Accueil — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — accueil après connexion (nom imposé par le socle : gestion/accueil.html). Dans l'ordre : ce qui attend une
       action (selon les droits, /api/accueil/a-traiter), la journée et qui est en service.
       Rien n'y répète le menu. À adapter à ce dont l'entreprise a besoin au quotidien. -->
  <main class="admin-contenu">
    <div class="entete-admin">
      <div>
        <h1 style="margin-bottom:2px;" id="bonjour">Bonjour</h1>
        <p style="margin:0;font-size:var(--fs-3);" id="date-du-jour">Bienvenue dans l’espace de gestion de {{nom}}.</p>
      </div>
    </div>
    <div id="zone-message"></div>
    <!-- en attendant les données : une silhouette de la page, puis tout s'affiche d'un coup (les blocs ne se poussent
         plus les uns les autres en arrivant) -->
    <div class="accueil-attente" id="accueil-attente" aria-hidden="true">
      <div class="accueil-panneaux"><div class="accueil-panneau squelette"></div><div class="accueil-panneau squelette"></div><div class="accueil-panneau squelette"></div></div>
    </div>
    <div class="accueil-corps" id="accueil-corps" aria-busy="true">
    <section class="accueil-a-traiter cache" id="a-traiter" aria-labelledby="titre-a-traiter">
      <h2 id="titre-a-traiter">À traiter</h2>
      <ul id="a-traiter-liste"></ul>
    </section>
    <div class="accueil-panneaux">
      <!-- la semaine en chiffres : mon run (fiche RH), puis l'équipe et son écart avec la semaine d'avant (permission « quota ») -->
      <section class="accueil-panneau cache" aria-labelledby="titre-semaine" id="panneau-semaine">
        <div class="accueil-panneau-entete">
          <h2 id="titre-semaine">Cette semaine</h2>
          <a href="quota.html" class="cache" id="lien-quota">Voir le quota</a>
        </div>
        <ul class="accueil-liste accueil-chiffres" id="semaine"></ul>
      </section>
      <section class="accueil-panneau" aria-labelledby="titre-aujourdhui">
        <div class="accueil-panneau-entete">
          <h2 id="titre-aujourdhui">Aujourd’hui</h2>
          <a href="agenda.html">Ouvrir l’agenda</a>
        </div>
        <ul class="accueil-liste" id="aujourdhui"><li class="accueil-vide">Chargement…</li></ul>
        <div class="cache" id="a-venir-bloc">
          <h3 class="accueil-sous-titre">Les 7 prochains jours</h3>
          <ul class="accueil-liste" id="a-venir"></ul>
        </div>
      </section>
      <section class="accueil-panneau cache" aria-labelledby="titre-service" id="panneau-service">
        <div class="accueil-panneau-entete">
          <h2 id="titre-service">En service</h2>
          <span class="admin-en-service-nombre" id="nombre-service"></span>
        </div>
        <ul class="accueil-liste admin-service-liste" id="en-service"></ul>
        <button type="button" class="btn btn-fantome btn-petit cache" id="service-tout" aria-controls="en-service" aria-expanded="false"></button>
      </section>
    </div>
    </div>
  </main>
  <script>
    const PARIS = { timeZone: 'Europe/Paris' };
    // jours à Paris (AAAA-MM-JJ), comme ceux de l'agenda
    const jourParis = d => new Intl.DateTimeFormat('en-CA', { ...PARIS, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    const aujourdhui = jourParis(new Date());
    const dansUneSemaine = jourParis(new Date(Date.now() + 7 * 86400e3));
    const jourLisible = j => new Date(`${j}T12:00:00Z`).toLocaleDateString('fr-FR', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
    const ligneVide = texte => `<li class="accueil-vide">${texte}</li>`;
    const SERVICE_VISIBLES = 8;
    const montant = n => `${Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} $`;
    // lundi d'une semaine (AAAA-MM-JJ), décalé de n semaines ; même calcul que quota.js (jours en UTC, midi évite l'heure d'été)
    const lundi = (j, n = 0) => { const d = new Date(`${j}T12:00:00Z`); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7 + 7 * n); return d.toISOString().slice(0, 10); };
    // une ligne de chiffre : libellé, valeur / objectif, barre (couleurs de Quota : rouge à 0, orange en cours, vert atteint),
    // et l'écart avec la semaine d'avant quand on le connaît
    function ligneChiffre(libelle, valeur, objectif, format, avant, semaineAvant) {
      const etat = objectif <= 0 ? 'gris' : valeur <= 0 ? 'rouge' : valeur < objectif ? 'orange' : 'vert';
      const pct = objectif > 0 ? Math.min(100, Math.round(valeur / objectif * 100)) : 0;
      const ecart = avant == null ? '' : valeur - avant;
      const texteEcart = ecart === '' ? '' : `<span class="accueil-ecart accueil-ecart--${ecart > 0 ? 'hausse' : ecart < 0 ? 'baisse' : 'egal'}">${ecart > 0 ? '+' : ecart < 0 ? '−' : ''}${socle.esc(format(Math.abs(ecart)))} par rapport à la semaine du ${socle.esc(jourLisible(semaineAvant).replace(/^\S+ /, ''))}</span>`;
      return `<li><span class="accueil-chiffre-libelle">${socle.esc(libelle)}</span>
        <span class="accueil-chiffre-valeur">${socle.esc(format(valeur))}${objectif > 0 ? `<small> / ${socle.esc(format(objectif))}</small>` : ''}</span>
        ${objectif > 0 ? `<div class="run-barre run-etat-${etat}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${socle.esc(libelle)} : objectif"><div class="run-barre-remplie run-etat-${etat}" style="width:${pct}%"></div></div>` : ''}
        ${texteEcart}</li>`;
    }

    gestion.coque('accueil').then(async moi => {
      document.getElementById('bonjour').textContent = `Bonjour, ${moi.nom || moi.pseudo}`;
      const jour = new Date().toLocaleDateString('fr-FR', { ...PARIS, weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('date-du-jour').textContent = jour.charAt(0).toUpperCase() + jour.slice(1);

      // chaque bloc se charge seul : une erreur dans l'un n'empêche pas d'afficher les autres
      const equipe = socle.peut(moi, 'quota'), avant = lundi(aujourdhui, -1);
      const [taches, agenda, service, fiche, run, runAvant, fact, factAvant] = await Promise.allSettled([
        socle.api('/api/accueil/a-traiter'),
        socle.api(`/api/agenda?debut=${aujourdhui}&fin=${dansUneSemaine}`),
        socle.api('/api/services/en-cours'),
        socle.api('/api/moi/fiche'),
        ...(equipe ? [`/api/run?semaine=${lundi(aujourdhui)}`, `/api/run?semaine=${avant}`,
          `/api/compta/factures/classement?semaine=${lundi(aujourdhui)}`, `/api/compta/factures/classement?semaine=${avant}`].map(u => socle.api(u)) : []),
      ]);

      // cette semaine : chaque ligne n'apparaît que si sa donnée est arrivée ; panneau masqué s'il n'y en a aucune
      const unites = n => `${n} unité${n > 1 ? 's' : ''}`;
      const lignes = [];
      const q = fiche.value?.quota;
      if (q) lignes.push(ligneChiffre('Mon run', q.unites, q.quota, unites));
      if (run?.value) lignes.push(ligneChiffre('Run de l’équipe', run.value.uniteSemaine, run.value.objectifEquipe, unites, runAvant.value?.uniteSemaine, avant));
      if (fact?.value) lignes.push(ligneChiffre('Facturé par l’équipe', fact.value.montantSemaine, fact.value.objectifEquipe, montant, factAvant.value?.montantSemaine, avant));
      document.getElementById('semaine').innerHTML = lignes.join('');
      document.getElementById('panneau-semaine').classList.toggle('cache', !lignes.length);
      document.getElementById('lien-quota').classList.toggle('cache', !equipe);

      // à traiter : une ligne par action, vers la page qui la traite ; bloc masqué s'il n'y a rien
      const liste = taches.value?.taches || [];
      document.getElementById('a-traiter').classList.toggle('cache', !liste.length);
      document.getElementById('a-traiter-liste').innerHTML = liste.map(t => `<li><a class="accueil-tache${t.alerte ? ' accueil-tache--alerte' : ''}" href="${socle.esc(t.lien)}">
          <span class="accueil-tache-nombre" aria-hidden="true">${t.alerte ? '!' : Number(t.nombre)}</span><span>${socle.esc(t.texte)}</span>${gestion.ico('chevron')}</a></li>`).join('');

      // journée : les rendez-vous du jour ; s'il n'y en a pas, les prochains de la semaine
      const ul = document.getElementById('aujourdhui');
      if (agenda.status === 'rejected') ul.innerHTML = ligneVide('L’agenda n’a pas pu être chargé. Rechargez la page dans un instant.');
      else {
        const evts = (agenda.value.evenements || []).sort((a, b) => (a.jour + a.heure_debut).localeCompare(b.jour + b.heure_debut));
        const ligne = (e, avecJour) => `<li><span class="accueil-heure">${avecJour ? `${socle.esc(jourLisible(e.jour))}, ` : ''}${socle.esc(e.heure_debut)}–${socle.esc(e.heure_fin)}</span><span class="accueil-texte">${socle.esc(e.titre)}</span></li>`;
        const duJour = evts.filter(e => e.jour === aujourdhui), aVenir = evts.filter(e => e.jour > aujourdhui).slice(0, 5);
        ul.innerHTML = duJour.length ? duJour.map(e => ligne(e, false)).join('')
          : ligneVide(`Rien de prévu aujourd’hui. <a href="agenda.html?nouveau=1">Ajouter un rendez‑vous</a>`);
        document.getElementById('a-venir-bloc').classList.toggle('cache', duJour.length > 0 || !aVenir.length);
        document.getElementById('a-venir').innerHTML = aVenir.map(e => ligne(e, true)).join('');
      }

      // en service : seulement après réception d'un événement du bot ; les 8 premiers, puis « Voir les N autres »
      if (service.value?.regle) {
        const s = gestion.ordreEnService(service.value.enService);
        const listeService = document.getElementById('en-service'), tout = document.getElementById('service-tout');
        document.getElementById('panneau-service').classList.remove('cache');
        document.getElementById('nombre-service').textContent = s.length;
        const dessiner = deplie => {
          const visibles = deplie ? s : s.slice(0, SERVICE_VISIBLES);
          listeService.innerHTML = s.length ? visibles.map(gestion.ligneEnService).join('') : ligneVide('Personne n’est en service pour le moment.');
          tout.classList.toggle('cache', s.length <= SERVICE_VISIBLES);
          tout.setAttribute('aria-expanded', String(deplie));
          tout.textContent = deplie ? 'Réduire la liste' : `Voir les ${s.length - SERVICE_VISIBLES} autres`;
        };
        tout.addEventListener('click', () => dessiner(tout.getAttribute('aria-expanded') !== 'true'));
        dessiner(false);
      }
      document.getElementById('accueil-attente').remove();
      document.getElementById('accueil-corps').removeAttribute('aria-busy');
      const erreur = [taches, run, fact].find(r => r?.status === 'rejected');
      if (erreur) gestion.message('zone-message', `Une partie de l’accueil n’a pas pu se charger (${erreur.reason.message}). Rechargez la page dans un instant.`);
    });
  </script>
</body>
</html>
