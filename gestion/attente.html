<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Demande en attente — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — compte connecté mais pas (encore) validé (nom imposé par le socle : gestion/attente.html). -->
  <div class="ecran-connexion">
    <div class="carte-connexion">
      <div class="logo-connexion"><img src="/assets/logo.png" alt="" width="64" height="64"><span>{{nom}}</span></div>
      <h1 class="connexion-titre" id="titre">Demande envoyée ✓</h1>
      <p style="text-align:center;font-size:0.88rem;" id="texte">Votre compte Discord a bien été reconnu. Un responsable doit maintenant valider votre accès. Revenez un peu plus tard.</p>
      <div id="zone-message"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;">
        <button class="btn btn-fantome" style="flex:1;" type="button" id="quitter">Se déconnecter</button>
        <button class="btn btn-danger" style="flex:1;" type="button" id="retirer">Retirer ma demande</button>
      </div>
      <p style="text-align:center;margin-top:18px;"><a href="/" style="font-size:0.85rem;color:var(--text-faint);"><svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Retour au site</a></p>
    </div>
  </div>
  <script>
    socle.moi().then(moi => {
      if (moi.statut === 'valide') location.href = 'accueil.html';
      if (moi.statut === 'refuse') {
        document.getElementById('retirer').style.display = 'none';   // un refus ne s'efface pas en supprimant son compte
        document.getElementById('titre').textContent = 'Demande refusée';
        document.getElementById('texte').textContent = 'Votre demande d’accès a été refusée. Pour en parler, contactez un responsable sur Discord.';
      }
    }).catch(() => {});
    document.getElementById('quitter').addEventListener('click', () => socle.deconnexion());
    document.getElementById('retirer').addEventListener('click', async () => {
      if (!await gestion.confirmer('Votre compte sera supprimé du site. Vous pourrez refaire une demande plus tard.', 'Retirer votre demande ?', 'Retirer')) return;
      try { await socle.api('/api/moi', { method: 'DELETE' }); location.href = '/'; } catch (e) { gestion.message('zone-message', `La suppression n’a pas abouti (${e.message}). Réessayez dans un instant.`); }
    });
  </script>
</body>
</html>
