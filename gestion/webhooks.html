<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <link rel="stylesheet" href="/gestion/webhooks.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Bot Discord — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — webhooks (permission « webhooks », serveur : socle/routes/webhooks-abonnements.ts et
       socle/routes/webhooks-journal.ts). Deux onglets : Abonnements (une clé par type d'événement, chiffrée en
       base) et Événements reçus (journal, pour diagnostiquer un traitement en échec — contenu inchangé). -->
  <main class="admin-contenu">
    <div class="entete-admin">
      <div>
        <h1 style="margin-bottom:2px;">Bot Discord</h1>
        <p style="margin:0;font-size:var(--fs-3);">Abonnements du bot Discord et événements reçus.</p>
      </div>
    </div>
    <div id="zone-message" role="status"></div>

    <div class="compta-sous-onglets" role="tablist" aria-label="Rubriques du bot Discord">
      <button type="button" class="compta-sous-onglet actif" role="tab" id="onglet-abonnements" aria-selected="true" aria-controls="panneau-abonnements" data-webhooks-onglet="abonnements">
        <svg class="ico" aria-hidden="true"><use href="#ico-key"></use></svg> Abonnements</button>
      <button type="button" class="compta-sous-onglet" role="tab" id="onglet-journal" aria-selected="false" aria-controls="panneau-journal" data-webhooks-onglet="journal">
        <svg class="ico" aria-hidden="true"><use href="#ico-sync"></use></svg> Événements reçus</button>
    </div>

    <section id="panneau-abonnements" role="tabpanel" aria-labelledby="onglet-abonnements">
      <div class="webhooks-adresse">
        <span>Adresse à donner au bot</span>
        <code id="adresse-bot">{{url}}/webhooks/bot</code>
        <button type="button" class="btn btn-fantome btn-petit" id="bouton-copier-adresse">
          <svg class="ico" aria-hidden="true"><use href="#ico-copy"></use></svg> Copier l’adresse</button>
      </div>
      <div class="comptes-liste webhooks-liste">
        <div class="comptes-entete"><span>Événement</span><span>État</span><span>Dernier événement reçu</span><span></span></div>
        <div id="liste-abonnements"></div>
      </div>
    </section>

    <section id="panneau-journal" role="tabpanel" aria-labelledby="onglet-journal" class="cache">
      <div class="comptes-outils filtres-select">
        <select id="filtre-type" aria-label="Filtrer par type"></select>
        <select id="filtre-traite" aria-label="Filtrer par état"></select>
      </div>
      <div class="carte-table">
        <table class="table-admin" id="table-webhooks">
          <thead><tr id="entete-webhooks"></tr></thead>
          <tbody id="corps-table-webhooks"></tbody>
        </table>
      </div>
    </section>
  </main>

<!-- Détail d'un événement reçu : tiroir à droite (plein écran sur téléphone) — inchangé. -->
<div class="modale-fond tiroir-fond cache" id="tiroir-webhook" data-echap>
  <div class="tiroir" role="dialog" aria-modal="true" aria-labelledby="tiroir-webhook-titre">
    <div class="tiroir-entete">
      <div class="tiroir-identite">
        <h2 id="tiroir-webhook-titre"></h2>
        <p class="tiroir-sous-titre" id="tiroir-webhook-sous-titre"></p>
      </div>
      <button type="button" id="fermer-tiroir-webhook" aria-label="Fermer">✕</button>
    </div>
    <div class="tiroir-corps" id="tiroir-webhook-corps"></div>
  </div>
</div>

<!-- Configurer / remplacer la clé d'un abonnement, ou consulter son historique : même tiroir, deux contenus. -->
<div class="modale-fond tiroir-fond cache" id="tiroir-abonnement" data-echap>
  <div class="tiroir" role="dialog" aria-modal="true" aria-labelledby="tiroir-abonnement-titre">
    <div class="tiroir-entete">
      <div class="tiroir-identite">
        <h2 id="tiroir-abonnement-titre"></h2>
        <p class="tiroir-sous-titre" id="tiroir-abonnement-sous-titre"></p>
      </div>
      <button type="button" id="fermer-tiroir-abonnement" aria-label="Fermer">✕</button>
    </div>
    <div class="tiroir-corps" id="tiroir-abonnement-corps"></div>
    <div class="tiroir-pied" id="tiroir-abonnement-pied"></div>
  </div>
</div>

  <script src="/gestion/webhooks.js"></script>
</body>
</html>
