<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Accès refusé — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — envoyée par le serveur (403) quand une page demande une permission que le compte n'a pas (nom imposé
       par le socle : gestion/refuse.html). Adresses absolues : elle remplace n'importe quelle page. -->
  <div class="ecran-connexion">
    <div class="carte-connexion" style="text-align:center;">
      <div class="logo-connexion"><img src="/assets/logo.png" alt="" width="64" height="64"><span>{{nom}}</span></div>
      <h1 class="connexion-titre">Accès refusé</h1>
      <p style="font-size:var(--fs-3);">Votre grade ne donne pas accès à cette page.</p>
      <a class="btn btn-or" style="width:100%;" href="/gestion/accueil.html">Retour à l’accueil de la gestion</a>
    </div>
  </div>
</body>
</html>
